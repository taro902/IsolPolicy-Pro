name: Build and Verify IsolPolicy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare executable Gradle wrapper
        run: chmod +x gradlew

      - name: Static source hygiene gate
        run: |
          AIDL_COUNT=$(find app/src -name '*.aidl' | wc -l)
          if [ "$AIDL_COUNT" -ne 0 ]; then
            echo "ERROR: Orphan .aidl files detected ($AIDL_COUNT)"
            find app/src -name '*.aidl'
            exit 1
          fi
          grep -q 'aidl = false' app/build.gradle.kts

      - name: Prepare release signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          KS_PATH="$RUNNER_TEMP/isolpolicy-release.p12"
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_KEYSTORE_PASS" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASS" ]; then
            printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KS_PATH"
            keytool -list -keystore "$KS_PATH" -storetype PKCS12 -storepass "$SIGNING_KEYSTORE_PASS" -alias "$SIGNING_KEY_ALIAS"
            echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$SIGNING_KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$SIGNING_KEY_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            EPH_PASS="ephemeral-$(date +%s)-key"
            echo "::add-mask::$EPH_PASS"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -storepass "$EPH_PASS" \
              -keypass "$EPH_PASS" \
              -alias isolationpolicy \
              -keyalg EC \
              -groupname secp256r1 \
              -sigalg SHA256withECDSA \
              -validity 10000 \
              -dname "CN=IsolPolicy, OU=CI, O=taro902, C=ID"
            echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$EPH_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=isolationpolicy" >> "$GITHUB_ENV"
            echo "KEY_PASS=$EPH_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Release and Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK hygiene, size budget, and signatures
        run: |
          UNSIGNED_COUNT=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | wc -l)
          if [ "$UNSIGNED_COUNT" -ne 0 ]; then
            echo "ERROR: Unsigned release APK detected"
            exit 1
          fi
          REL_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ ! -f "$REL_APK" ] || [ ! -f "$DBG_APK" ]; then
            echo "ERROR: Expected APK artifacts missing"
            exit 1
          fi
          REL_BYTES=$(stat -c%s "$REL_APK")
          echo "Release APK size: $REL_BYTES bytes (budget <= 665600 bytes, mode=$SIGNING_MODE)"
          if [ "$REL_BYTES" -gt 665600 ]; then
            echo "ERROR: Release APK exceeds 650 KB size budget ($REL_BYTES bytes)"
            exit 1
          fi
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$REL_APK"

          VER=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          cp "$REL_APK" "dist/IsolPolicy-v${VER}-release.apk"
          cp "$DBG_APK" "dist/IsolPolicy-v${VER}-debug.apk"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isolpolicy-apks
          path: dist/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
