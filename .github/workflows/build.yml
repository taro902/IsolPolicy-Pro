name: Build IsolPolicy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias isolationpolicy \
            -keyalg EC \
            -keysize 256 \
            -validity 10000 \
            -storepass IsolPolicy2026 \
            -keypass IsolPolicy2026 \
            -dname "CN=Android, OU=Android, O=Google Inc., L=Mountain View, ST=California, C=US"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=IsolPolicy2026" >> "$GITHUB_ENV"
          echo "KEYPASS=IsolPolicy2026" >> "$GITHUB_ENV"

      - name: Assemble Release and Debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Stage Compiled APKs
        id: stage
        run: |
          rel=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          dbg=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          mkdir -p "$RUNNER_TEMP/out"
          cp "$rel" "$RUNNER_TEMP/out/IsolPolicy-v2.1.0-release.apk"
          cp "$dbg" "$RUNNER_TEMP/out/IsolPolicy-v2.1.0-debug.apk"
          {
            echo "release=$RUNNER_TEMP/out/IsolPolicy-v2.1.0-release.apk"
            echo "debug=$RUNNER_TEMP/out/IsolPolicy-v2.1.0-debug.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsolPolicy-v2.1.0
          path: ${{ runner.temp }}/out/*.apk

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: v2.1.0
          name: IsolPolicy v2.1.0
          prerelease: false
          files: |
            ${{ steps.stage.outputs.release }}
            ${{ steps.stage.outputs.debug }}
