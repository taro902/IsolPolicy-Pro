name: Build IsolPolicy API 102 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias isolationpolicy \
            -keyalg EC \
            -keysize 256 \
            -validity 10000 \
            -storepass IsolPolicy2026 \
            -keypass IsolPolicy2026 \
            -dname "CN=Android, OU=Android, O=Google Inc., L=Mountain View, ST=California, C=US"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASS: IsolPolicy2026
          KEYPASS: IsolPolicy2026
        run: gradle assembleRelease --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsolPolicy-v2.0-API102-Release
          path: app/build/outputs/apk/release/*.apk
